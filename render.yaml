services:
  - type: web
    name: project-camp-server
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /api/v1/healthcheck
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: ACCESS_TOKEN_SECRET
        sync: false
      - key: REFRESH_TOKEN_SECRET
        sync: false
      - key: ACCESS_TOKEN_EXPIRY
        value: "1d"
      - key: REFRESH_TOKEN_EXPIRY
        value: "10d"
      # Public URLs, not secrets — checked in so a fresh deploy self-configures.
      # Must match the Vercel origin exactly, no trailing slash.
      - key: CORS_ORIGIN
        value: https://project-camp-fnza.vercel.app
      - key: SERVER_URL
        value: https://project-camp-server.onrender.com
      - key: FORGOT_PASSWORD_REDIRECT_URL
        value: https://project-camp-fnza.vercel.app/reset-password
      - key: MAILTRAP_SMTP_HOST
        value: sandbox.smtp.mailtrap.io
      - key: MAILTRAP_SMTP_PORT
        value: "2525"
      - key: MAILTRAP_SMTP_USER
        sync: false
      - key: MAILTRAP_SMTP_PASS
        sync: false
