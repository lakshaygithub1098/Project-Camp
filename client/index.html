<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ProjectCamp — collaborative project management for small teams."
    />
    <title>ProjectCamp</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash of the wrong theme.
      try {
        var stored = localStorage.getItem('projectcamp.theme')
        var system = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        if ((stored === null ? system : stored === 'system' ? system : stored) === 'dark') {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
